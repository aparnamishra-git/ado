stages:
  - stage: init
    displayName: INIT
    jobs:
      - job: init
        displayName: INIt
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'Aparna_Services'
              backendAzureRmStorageAccountName: 'aparnamishrastorage108'
              backendAzureRmContainerName: 'mishracontainer'
              backendAzureRmKey: 'mishra_terraform.tfstate'